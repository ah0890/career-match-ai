# Streamlit theme — mirrors src/ui/tokens.py (kept in sync by tests/unit/test_tokens.py).
[theme]
base = "light"
primaryColor = "#13294B"
backgroundColor = "#F4F6FA"
secondaryBackgroundColor = "#EDF1F7"
textColor = "#0F172A"
borderColor = "#E1E7EF"
linkColor = "#1D4ED8"
linkUnderline = false
# System font stack: Inter/Manrope are used when installed locally; nothing is downloaded.
font = "Inter, Manrope, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
headingFont = "Inter, Manrope, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = false
greenColor = "#04694F"
greenBackgroundColor = "#E6F5EE"
yellowColor = "#8A4B08"
yellowBackgroundColor = "#FEF4E2"
redColor = "#B42318"
redBackgroundColor = "#FDECEB"
blueColor = "#1D4ED8"
chartCategoricalColors = ["#2563EB", "#13294B", "#04694F", "#8A4B08", "#B42318", "#8A94A6"]

[theme.sidebar]
# Dark navy navigation (contrast checked in tests/unit/test_tokens.py).
backgroundColor = "#0C1A31"
secondaryBackgroundColor = "#1B2D4F"
textColor = "#D5DEEC"
borderColor = "#1B2D4F"
primaryColor = "#7FA6FF"

[server]
# Only this computer can open the app: it holds personal career data. Change to "0.0.0.0" only
# behind proper authentication (see SECURITY.md).
address = "localhost"
enableXsrfProtection = true
enableCORS = true
# Upload ceiling at the transport level; the app enforces CAREERMATCH_MAX_UPLOAD_MB itself.
maxUploadSize = 50
enableStaticServing = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
